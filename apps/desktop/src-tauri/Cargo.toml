[package]
name = "autonet-preview"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "AutoNet 只读预览（Tauri 2，P1）"
publish = false

[lib]
name = "autonet_preview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
autonet-contracts = { path = "../../../crates/autonet-contracts" }
autonet-storage = { path = "../../../crates/autonet-storage", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Services"] }
