name: Windows offline regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Build and run offline fixtures
        shell: pwsh
        run: pwsh.exe -NoLogo -NoProfile -File scripts/build.ps1 -Publish
      - name: Verify bundle integrity (工单 #19)
        shell: pwsh
        run: pwsh.exe -NoLogo -NoProfile -File scripts/verify-bundle.ps1 -Bundle artifacts/AutoNet-win-x64 -ExpectedCommit ${{ github.sha }}
      - name: Verify-bundle QA self-test
        shell: pwsh
        run: pwsh.exe -NoLogo -NoProfile -File scripts/qa-verify-bundle.ps1
      - name: Install-smoke environment guard self-test
        shell: pwsh
        run: pwsh.exe -NoLogo -NoProfile -File scripts/qa-install-smoke-guard.ps1
      # 工单 #36：回滚兼容判定校验——冻结的已发布版本读取规则副本必须与真实旧版逐条一致。
      # 浅克隆默认没有 tag，脚本会自行抓取；需要仓库的读权限与本地 SDK。
      - name: Released reader compatibility check (工单 #36)
        shell: pwsh
        run: pwsh.exe -NoLogo -NoProfile -File scripts/check-released-reader.ps1
      - name: Upload build evidence and Windows package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AutoNet-win-x64
          path: |
            artifacts/validation/
            artifacts/AutoNet-win-x64/
          if-no-files-found: warn

  # 工单 #20（ADR-0010）：一次性 runner 上的真装冒烟矩阵（runner 自带管理员，install.ps1 提权分支直接执行）。
  # ⚠️ 该脚本绝不能在本机运行——会覆盖安装本机 AutoNet。
  install-smoke:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Build and publish bundle
        shell: pwsh
        run: pwsh.exe -NoLogo -NoProfile -File scripts/build.ps1 -Publish
      - name: Install / reinstall / uninstall smoke matrix
        shell: pwsh
        run: pwsh.exe -NoLogo -NoProfile -File scripts/qa-install-smoke.ps1
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-smoke
          path: artifacts/validation/qa-install-smoke/
          if-no-files-found: warn
