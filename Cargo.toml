[workspace]
resolver = "2"
members = [
    "crates/autonet-contracts",
    "crates/autonet-core",
    "crates/autonet-storage",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
